version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # torch and torchvision releases are version-locked to each other, so they
      # must be bumped in the same pull request
      pytorch:
        patterns:
          - "torch"
          - "torchvision"
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
